name: cf-pages

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: cf-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Deploy target
        id: tgt
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            echo "branch=${{ github.head_ref }}" >> "$GITHUB_OUTPUT"
            echo "kind=preview" >> "$GITHUB_OUTPUT"
          else
            echo "branch=main" >> "$GITHUB_OUTPUT"
            echo "kind=production" >> "$GITHUB_OUTPUT"
          fi
      - name: Install
        run: npm ci
      - name: Build (next-on-pages pinned)
        run: npx @cloudflare/next-on-pages@1.13.16
      - name: Edge adapter sanity check
        run: |
          CFG=$(find .vercel/output/functions -name '.vc-config.json' | wc -l)
          [[ "$CFG" -gt 0 ]] || { echo "FAIL: no adapter functions"; exit 1; }
      - name: Deploy to Cloudflare Pages
        id: deploy
        run: |
          npx wrangler@3 pages deploy .vercel/output/static --project-name the-skate-workshop-website --branch "${{ steps.tgt.outputs.branch }}" --commit-dirty=true 2>&1 | tee /tmp/deploy.log
          URL=$(grep -oE 'https://[a-z0-9]+\.(cf|pages)\.dev[^ ]*' /tmp/deploy.log | tail -1 || true)
          [[ -n "$URL" ]] && echo "url=$URL" >> "$GITHUB_OUTPUT" || true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      - name: Comment preview URL
        if: steps.tgt.outputs.kind == 'preview'
        uses: actions/github-script@v7
        with:
          script: |
            const url = process.env.DEPLOY_URL || '(url unavailable — check Actions log)';
            github.rest.issues.createComment({{
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🚀 CF Pages preview: ${url}`
            }})
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
